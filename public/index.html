<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Call Assistant - Rowaiye Media</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: gold;
    }

    input {
      width: 80%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: gold;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.8;
    }

    .card {
      background: #121826;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>📞 AI Call Assistant</h1>
  <p>Rowaiye Media Campaign System</p>

  <div class="card">
    <h3>Enter Phone Numbers</h3>
    <input 
      type="text" 
      id="numbers" 
      placeholder="+2348012345678,+2348098765432"
    />
    <br/>
    <button onclick="startCampaign()">Start Campaign</button>
  </div>

  <div class="card">
    <h3>📊 Campaign Stats</h3>
    <p>Total Calls: <span id="total">0</span></p>
    <p>YES Responses: <span id="yes">0</span></p>
    <p>NO Responses: <span id="no">0</span></p>
    <p>Conversion Rate: <span id="rate">0%</span></p>

    <button onclick="loadStats()">Refresh Stats</button>
  </div>

  <script>
    const BASE_URL = "https://ai-call-assistant-znyw.onrender.com";

    // ===============================
    // START CAMPAIGN
    // ===============================
    async function startCampaign() {
      try {
        const raw = document.getElementById("numbers").value;

        if (!raw) {
          alert("Please enter phone numbers");
          return;
        }

        const numbers = raw.split(",").map(n => n.trim());

        console.log("📤 Sending numbers:", numbers);

        const res = await fetch(BASE_URL + "/api/bulk-call", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ numbers })
        });

        const data = await res.json();

        console.log("✅ Server response:", data);

        alert("🚀 Campaign started!");
      } catch (err) {
        console.error("❌ Error:", err);
        alert("Error starting campaign. Check console.");
      }
    }

    // ===============================
    // LOAD STATS
    // ===============================
    async function loadStats() {
      try {
        const res = await fetch(BASE_URL + "/api/stats");
        const data = await res.json();

        console.log("📊 Stats:", data);

        document.getElementById("total").innerText = data.total;
        document.getElementById("yes").innerText = data.yes;
        document.getElementById("no").innerText = data.no;
        document.getElementById("rate").innerText = data.conversionRate;

      } catch (err) {
        console.error("❌ Stats error:", err);
      }
    }

    // Auto load stats on page load
    loadStats();
  </script>

</body>
</html>
