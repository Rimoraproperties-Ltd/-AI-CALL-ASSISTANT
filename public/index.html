<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>AI Call Assistant</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

h1{
color:gold;
}

.card{
background:#1e293b;
padding:20px;
margin:20px auto;
width:80%;
border-radius:10px;
}

textarea,input{
width:90%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:none;
}

button{
padding:10px 20px;
margin-top:10px;
border:none;
border-radius:6px;
background:gold;
color:black;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<h1>AI Call Campaign System</h1>

<div class="card">
<h3>Call Script</h3>

<textarea id="script" rows="4"
placeholder="Write what the AI should say during the call"></textarea>
</div>


<div class="card">
<h3>Phone Numbers</h3>

<input id="numbers"
placeholder="+2348012345678,+2348098765432">

<br>

<button onclick="startCampaign()">Start Campaign</button>

</div>


<div class="card">

<h3>Campaign Stats</h3>

<p>Total Calls: <span id="total">0</span></p>
<p>YES: <span id="yes">0</span></p>
<p>NO: <span id="no">0</span></p>
<p>Conversion: <span id="rate">0%</span></p>

<button onclick="loadStats()">Refresh Stats</button>

</div>


<script>

const BASE_URL = "https://ai-call-assistant-znyw.onrender.com";


async function startCampaign(){

const raw = document.getElementById("numbers").value;
const script = document.getElementById("script").value;

if(!raw){
alert("Enter numbers");
return;
}

const numbers = raw.split(",").map(n => n.trim());

await fetch(BASE_URL + "/api/script",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({script})
});

await fetch(BASE_URL + "/api/bulk-call",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({numbers})
});

alert("Campaign Started");

}



async function loadStats(){

const res = await fetch(BASE_URL + "/api/stats");
const data = await res.json();

document.getElementById("total").innerText = data.total;
document.getElementById("yes").innerText = data.yes;
document.getElementById("no").innerText = data.no;
document.getElementById("rate").innerText = data.conversionRate;

}

loadStats()

</script>

</body>
</html>
